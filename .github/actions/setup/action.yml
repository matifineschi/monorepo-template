name: Setup
description: Install Bun at the pinned version and restore the dependency cache

runs:
  using: composite
  steps:
    # The version is pinned rather than "latest" on purpose: a Bun release that
    # changes test-runner or install behaviour should break on a deliberate bump,
    # in a commit that says so, not on an unrelated PR.
    - name: Read the pinned Bun version
      id: bun-version
      shell: bash
      run: |
        version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}

    - name: Cache the Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # --frozen-lockfile fails rather than resolving: a lockfile that disagrees
    # with package.json is a commit someone forgot to include.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
