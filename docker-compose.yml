services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Web UI for inspecting the database at http://localhost:3002.
  # No container_name on purpose: Compose namespaces it per project, so two
  # checkouts of this template can run side by side.
  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      STORE_PATH: /app
      MASTERPASS: test
    volumes:
      - drizzle-gateway:/app
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev. In production point the
  # STORAGE_* vars at a real bucket (S3, R2, Spaces, Railway) — no code changes.
  # Console UI: http://localhost:9001 (minioadmin / minioadmin).
  #
  # Silo, not minio/minio: Docker Hub deleted that repository (and minio/mc),
  # and quay.io refuses anonymous pulls, so CI cannot fetch either. This tag
  # still accepts `server /data` and ships `mc`, which the healthcheck and the
  # bucket job both call. Keep the test stack's image on the same tag.
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket on startup, then exits. Idempotent — safe to
  # re-run on every `docker compose up`.
  # Same image as `minio` — `mc` is bundled in it. minio/mc is gone from Docker Hub.
  minio-createbucket:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/app-uploads &&
      echo 'bucket app-uploads ready';
      "

volumes:
  postgres_data:
  drizzle-gateway:
  redis_data:
  minio_data:
